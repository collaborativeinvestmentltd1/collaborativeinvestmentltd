<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management - CIL Admin</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar (same as dashboard) -->
        <nav class="admin-sidebar">
            <div class="sidebar-header">
                <h2>CIL Admin</h2>
                <p>Collaborative Investment Ltd</p>
            </div>
            
            <ul class="sidebar-nav">
                <li><a href="/admin/dashboard"> Dashboard</a></li>
                <li><a href="/admin/products" class="active"> Products</a></li>
                <li><a href="/admin/orders"> Orders</a></li>
                <li><a href="/admin/customers"> Customers</a></li>
                <li><a href="/admin/emails"> Email System</a></li>
                <li><a href="/admin/analytics"> Analytics</a></li>
                <li><a href="/admin/settings"> Settings</a></li>
            </ul>
            
            <div class="sidebar-footer">
                <button onclick="adminLogout()" class="btn-logout"> Logout</button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="admin-main">
            <header class="admin-header">
                <h1>Product Management</h1>
                <div class="header-actions">
                    <button onclick="showAddProductModal()" class="btn-refresh"> Add Product</button>
                    <button onclick="exportProducts()" class="btn-refresh"> Export</button>
                </div>
            </header>

            <!-- Product Filters -->
            <div class="filters-section">
                <input type="text" id="productSearch" placeholder="Search products..." class="search-input">
                <select id="categoryFilter" class="filter-select">
                    <option value="all">All Categories</option>
                    <option value="agriculture">Agriculture</option>
                    <option value="construction">Construction</option>
                    <option value="machinery">Machinery</option>
                    <option value="solar">Solar</option>
                    <option value="furniture">Furniture</option>
                </select>
                <select id="stockFilter" class="filter-select">
                    <option value="all">All Stock</option>
                    <option value="In Stock">In Stock</option>
                    <option value="Limited Stock">Limited Stock</option>
                    <option value="Made to Order">Made to Order</option>
                </select>
            </div>

            <!-- Products Table -->
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Category</th>
                            <th>Subcategory</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Min Order</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productsTable">
                        <!-- Products will be loaded here -->
                    </tbody>
                </table>
            </div>

            <!-- Product Count -->
            <div class="product-count" id="productCount">
                Showing 0 of 0 products
            </div>
        </main>
    </div>

    <!-- Add/Edit Product Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h3 id="modalTitle">Add New Product</h3>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Product Name *</label>
                            <input type="text" id="productName" required>
                        </div>
                        
                        <div class="form-group">
                            <label>Category *</label>
                            <select id="productCategory" required>
                                <option value="agriculture">Agriculture</option>
                                <option value="construction">Construction</option>
                                <option value="machinery">Machinery</option>
                                <option value="solar">Solar</option>
                                <option value="furniture">Furniture</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Subcategory</label>
                            <input type="text" id="productSubcategory">
                        </div>
                        
                        <div class="form-group">
                            <label>Price (₦) *</label>
                            <input type="number" id="productPrice" step="0.01" required>
                        </div>
                        
                        <div class="form-group">
                            <label>Stock Status *</label>
                            <select id="productStock" required>
                                <option value="In Stock">In Stock</option>
                                <option value="Limited Stock">Limited Stock</option>
                                <option value="Made to Order">Made to Order</option>
                            </select>
                        </div>
                        
                        <div class="form-group full-width">
                            <label>Description</label>
                            <textarea id="productDescription" rows="3"></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label>Minimum Order</label>
                            <input type="text" id="productMinOrder" placeholder="e.g., 1 unit, 100 blocks">
                        </div>
                        
                        <div class="form-group">
                            <label>Image URL</label>
                            <input type="text" id="productImage" placeholder="/img/category/product.jpg">
                        </div>
                        
                        <div class="form-group full-width">
                            <label>Tags (comma separated)</label>
                            <input type="text" id="productTags" placeholder="tag1, tag2, tag3">
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" onclick="closeModal()" class="btn-cancel">Cancel</button>
                        <button type="button" onclick="saveProduct()" class="btn-save">Save Product</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/admin.js"></script>
</body>
</html>
