<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Change Password</title>
<style>
body{font-family:Segoe UI;background:#f4f6f8;display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:#fff;padding:30px;border-radius:10px;width:100%;max-width:420px;box-shadow:0 10px 25px rgba(0,0,0,.1)}
h2{text-align:center;margin-bottom:20px}
input,button{width:100%;padding:12px;margin-bottom:12px;border-radius:6px;border:1px solid #ccc}
button{background:#1a5276;color:#fff;font-weight:bold;border:none;cursor:pointer}
.alert{display:none;padding:10px;border-radius:6px;margin-bottom:10px}
.error{background:#f8d7da;color:#721c24}
.success{background:#d1edff;color:#155724}
</style>
</head>
<body>

<div class="box">
<h2>Change Password</h2>
<div id="alert" class="alert"></div>

<input type="password" id="oldPass" placeholder="Current Password">
<input type="password" id="newPass" placeholder="New Password">
<input type="password" id="confirmPass" placeholder="Confirm New Password">
<button onclick="changePassword()">Update Password</button>
</div>

<script>
async function changePassword() {
  const oldPass = document.getElementById('oldPass').value;
  const newPass = document.getElementById('newPass').value;
  const confirmPass = document.getElementById('confirmPass').value;
  const alertBox = document.getElementById('alert');

  if (!oldPass || !newPass || !confirmPass) {
    alertBox.className = 'alert error';
    alertBox.textContent = 'All fields are required';
    alertBox.style.display = 'block';
    return;
  }

  if (newPass !== confirmPass) {
    alertBox.className = 'alert error';
    alertBox.textContent = 'Passwords do not match';
    alertBox.style.display = 'block';
    return;
  }

  const res = await fetch('/admin/change-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ oldPass, newPass })
  });

  const data = await res.json();
  alertBox.className = 'alert ' + (data.success ? 'success' : 'error');
  alertBox.textContent = data.message;
  alertBox.style.display = 'block';
}
</script>

</body>
</html>
