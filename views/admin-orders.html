<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders Management - CIL Admin</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="admin-container">
        <nav class="admin-sidebar">
            <div class="sidebar-header">
                <h2>CIL Admin</h2>
                <p>Collaborative Investment Ltd</p>
            </div>
            <ul class="sidebar-nav">
                <li><a href="/admin/dashboard"> Dashboard</a></li>
                <li><a href="/admin/products"> Products</a></li>
                <li><a href="/admin/orders" class="active"> Orders</a></li>
                <li><a href="/admin/customers"> Customers</a></li>
                <li><a href="/admin/emails"> Email System</a></li>
                <li><a href="/admin/analytics"> Analytics</a></li>
                <li><a href="/admin/settings"> Settings</a></li>
            </ul>
            <div class="sidebar-footer">
                <button onclick="logout()" class="btn-logout"> Logout</button>
            </div>
        </nav>

        <main class="admin-main">
            <header class="admin-header">
                <h1>Orders Management</h1>
                <div class="header-actions">
                    <button onclick="exportOrders()" class="btn-refresh"> Export Orders</button>
                    <button onclick="createSampleOrders()" class="btn-refresh"> Sample Data</button>
                </div>
            </header>

            <!-- Order Filters -->
            <div class="filters-section">
                <input type="text" id="orderSearch" placeholder="Search orders..." class="search-input" onkeyup="filterOrders()">
                <select id="statusFilter" class="filter-select" onchange="filterOrders()">
                    <option value="All">All Status</option>
                    <option value="Pending">Pending</option>
                    <option value="Confirmed">Confirmed</option>
                    <option value="Processing">Processing</option>
                    <option value="Shipped">Shipped</option>
                    <option value="Delivered">Delivered</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
                <input type="date" id="dateFilter" class="filter-select" onchange="filterOrders()">
            </div>

            <!-- Orders Stats -->
            <div class="stats-grid mini">
                <div class="stat-card mini">
                    <div class="stat-icon"></div>
                    <div class="stat-info">
                        <h3 id="pendingCount">0</h3>
                        <p>Pending</p>
                    </div>
                </div>
                <div class="stat-card mini">
                    <div class="stat-icon"></div>
                    <div class="stat-info">
                        <h3 id="processingCount">0</h3>
                        <p>Processing</p>
                    </div>
                </div>
                <div class="stat-card mini">
                    <div class="stat-icon"></div>
                    <div class="stat-info">
                        <h3 id="shippedCount">0</h3>
                        <p>Shipped</p>
                    </div>
                </div>
                <div class="stat-card mini">
                    <div class="stat-icon"></div>
                    <div class="stat-info">
                        <h3 id="deliveredCount">0</h3>
                        <p>Delivered</p>
                    </div>
                </div>
            </div>

            <!-- Orders Table -->
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)"></th>
                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Date</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Payment</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTable">
                        <!-- Orders will be loaded here -->
                    </tbody>
                </table>
            </div>

            <!-- Bulk Actions -->
            <div class="bulk-actions">
                <select id="bulkStatusAction" class="bulk-select">
                    <option value="">Update Status</option>
                    <option value="confirmed">Mark as Confirmed</option>
                    <option value="processing">Mark as Processing</option>
                    <option value="shipped">Mark as Shipped</option>
                    <option value="delivered">Mark as Delivered</option>
                    <option value="cancelled">Mark as Cancelled</option>
                </select>
                <button onclick="applyBulkStatus()" class="btn-action">Apply</button>
            </div>
        </main>
    </div>

    <!-- Order Details Modal -->
    <div id="orderModal" class="modal">
        <div class="modal-content" style="max-width: 800px;">
            <div class="modal-header">
                <h3 id="modalOrderTitle">Order Details</h3>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div id="orderDetailsContent">
                    <!-- Order details will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script src="/js/admin.js"></script>
</body>
</html>
