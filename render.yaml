services:
  - type: web
    name: collaborativeinvestmentltd
    env: node
    buildCommand: npm install
    startCommand: node app.js
    envVars:
      - key: MONGODB_URL
        sync: false  # Set this manually in dashboard
      - key: JWT_SECRET
        generateValue: true  # Render will generate a random value
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production